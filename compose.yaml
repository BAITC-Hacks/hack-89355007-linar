services:
  knowledge-db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: orglens
      POSTGRES_USER: orglens
      POSTGRES_PASSWORD: orglens_demo_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - orglens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orglens -d orglens"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  orglens_pgdata:
